name: Maigret OSINT Investigation

on:
  repository_dispatch:
    types: [maigret-investigation]
  workflow_dispatch:
    inputs:
      investigation_id:
        description: Investigation identifier
        required: true
      username:
        description: Public username to enumerate
        required: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')"
          echo "private=$private" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install Maigret
        if: steps.visibility.outputs.private == 'true'
        run: python -m pip install --require-hashes -r .github/workflows/requirements-maigret.txt
      - name: Run Maigret
        id: maigret
        if: steps.visibility.outputs.private == 'true'
        shell: bash
        env:
          INVESTIGATION_ID: ${{ github.event.client_payload.investigation_id || github.event.inputs.investigation_id }}
          USERNAME: ${{ github.event.client_payload.username || github.event.inputs.username }}
        run: |
          set -euo pipefail
          [[ "$INVESTIGATION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          [[ "$USERNAME" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{1,63}$ ]]
          mkdir -p artifacts
          if ! maigret "$USERNAME" --json simple --folderoutput artifacts >"$RUNNER_TEMP/maigret.log" 2>&1; then
            echo "Maigret failed; provider output is not written to workflow logs."
            exit 1
          fi
      - name: Upload private scan artifact
        if: always() && steps.visibility.outputs.private == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maigret-${{ github.event.client_payload.investigation_id || github.event.inputs.investigation_id }}
          path: artifacts/
          retention-days: 7
